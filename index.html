<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duesify — Coming soon</title>
  <meta name="description" content="Coming soon.">
  <meta property="og:title" content="Duesify">
  <meta property="og:description" content="Coming soon.">
  <meta property="og:url" content="https://www.duesify.com">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://www.duesify.com/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://www.duesify.com/">
  <meta name="theme-color" content="#04070f">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04070f;
      --text: #eaf0ff;
      --cyan: #7de3f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background-color: var(--bg); color-scheme: dark; }
    body { position: relative; isolation: isolate; }   /* keeps the sky + grid layers above any body background */
    /* clean black-to-navy: a soft navy glow behind the words, fading to near-black.
       Its own fixed layer, so the page stays dark even if a host styles html/body. */
    .sky {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background: radial-gradient(ellipse 75% 60% at 50% 45%, #13285c 0%, #0b1838 38%, #060b1a 70%, #020308 100%);
    }

    /* Decoration: faint blueprint grid + twinkling stars, both fading out towards the edges */
    .deco {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      -webkit-mask: radial-gradient(ellipse 70% 65% at 50% 47%, #000 20%, transparent 85%);
              mask: radial-gradient(ellipse 70% 65% at 50% 47%, #000 20%, transparent 85%);
    }
    .grid {
      background:
        linear-gradient(rgba(125, 170, 255, 0.07) 1px, transparent 1px) 0 0 / 56px 56px,
        linear-gradient(90deg, rgba(125, 170, 255, 0.07) 1px, transparent 1px) 0 0 / 56px 56px,
        linear-gradient(rgba(125, 170, 255, 0.035) 1px, transparent 1px) 0 0 / 14px 14px,
        linear-gradient(90deg, rgba(125, 170, 255, 0.035) 1px, transparent 1px) 0 0 / 14px 14px;
      background-position: center;
    }
    /* the grid lights up around the mouse, like a flashlight on a blueprint */
    .grid.lit {
      background:
        linear-gradient(rgba(125, 227, 245, 0.42) 1px, transparent 1px) 0 0 / 56px 56px,
        linear-gradient(90deg, rgba(125, 227, 245, 0.42) 1px, transparent 1px) 0 0 / 56px 56px,
        linear-gradient(rgba(125, 227, 245, 0.18) 1px, transparent 1px) 0 0 / 14px 14px,
        linear-gradient(90deg, rgba(125, 227, 245, 0.18) 1px, transparent 1px) 0 0 / 14px 14px;
      background-position: center;
      -webkit-mask: radial-gradient(240px circle at var(--mx, -999px) var(--my, -999px), #000, transparent 70%);
              mask: radial-gradient(240px circle at var(--mx, -999px) var(--my, -999px), #000, transparent 70%);
      opacity: 0;
      transition: opacity 0.5s;
    }
    .grid.lit.on { opacity: 1; }
    .stars {
      -webkit-mask: none; mask: none;
      inset: -20px;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .shoot {
      position: absolute;
      width: 130px; height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, rgba(207, 224, 255, 0), rgba(207, 224, 255, 0.9));
      transform-origin: 100% 50%;
    }
    .corner {
      position: fixed;
      width: 22px; height: 22px;
      border: 0 solid rgba(125, 170, 255, 0.35);
      pointer-events: none;
      z-index: 1;
    }
    .corner.tl { top: 18px; left: 18px; border-top-width: 1.5px; border-left-width: 1.5px; }
    .corner.tr { top: 18px; right: 18px; border-top-width: 1.5px; border-right-width: 1.5px; }
    .corner.bl { bottom: 18px; left: 18px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
    .corner.br { bottom: 18px; right: 18px; border-bottom-width: 1.5px; border-right-width: 1.5px; }
    .star {
      position: absolute;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: #cfe0ff;
      opacity: 0.15;
      animation: twinkle var(--d) ease-in-out var(--t) infinite;
    }
    .star.big { width: 3px; height: 3px; box-shadow: 0 0 6px rgba(160, 200, 255, 0.8); }
    @keyframes twinkle { 50% { opacity: 0.85; } }

    .mark, .foot {
      position: fixed;
      left: 0; right: 0;
      text-align: center;
      color: rgba(234, 240, 255, 0.45);
      pointer-events: none;
      z-index: 1;
    }
    .mark {
      top: 22px;
      font-size: 15px;
      letter-spacing: 0.32em;
      text-transform: lowercase;
      color: rgba(234, 240, 255, 0.7);
    }
    .mark i { color: var(--cyan); font-style: normal; }
    .foot {
      bottom: 18px;
      font: 600 12px/1 system-ui, sans-serif;
      letter-spacing: 0.08em;
    }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-family: "Manrope", system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: min(18vw, 21.5vh);
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -0.035em;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 0 40px rgba(110, 160, 255, 0.28), 0 2px 0 rgba(4, 8, 20, 0.35);
      padding: 1.1em 16px 0.6em;    /* room above for the robot's jumps */
    }
    .line { display: block; white-space: nowrap; }
    .w {
      display: inline-block;
      animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      animation-delay: calc(var(--i) * 140ms);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(0.3em); } }

    /* Splash bits for the hidden pool, portals and portal-gun shots */
    .ripple {
      position: absolute;
      width: 70px; height: 14px;
      margin: -7px 0 0 -35px;
      border: 2px solid rgba(125, 227, 245, 0.75);
      border-radius: 50%;
      z-index: 31;
      pointer-events: none;
      animation: ripple 0.9s ease-out forwards;
    }
    @keyframes ripple { from { transform: scale(0.3); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
    .portal {
      --c: 79, 216, 255;
      position: absolute;
      z-index: 15;
      border-radius: 50%;
      border: 4px solid rgb(var(--c));
      background: radial-gradient(ellipse at center, rgba(var(--c), 0.55), rgba(var(--c), 0.18) 55%, rgba(var(--c), 0) 72%);
      box-shadow: 0 0 18px rgba(var(--c), 0.8), inset 0 0 16px rgba(var(--c), 0.7);
      overflow: hidden;
      pointer-events: none;
      transform: scale(0);
      transition: transform 0.35s cubic-bezier(0.3, 1.5, 0.5, 1);
    }
    .portal::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: repeating-conic-gradient(from 0deg, rgba(var(--c), 0.55) 0 14deg, rgba(var(--c), 0) 14deg 40deg);
      -webkit-mask: radial-gradient(closest-side, transparent 18%, #000 60%, transparent 100%);
              mask: radial-gradient(closest-side, transparent 18%, #000 60%, transparent 100%);
      animation: swirl 1.6s linear infinite;
    }
    @keyframes swirl { to { transform: rotate(360deg); } }
    .portal.orange { --c: 255, 154, 60; }
    .portal.open { transform: scale(1); animation: wobble 1.2s ease-in-out infinite; }
    .portal.closing { transform: scale(0); transition-timing-function: ease-in; }
    @keyframes wobble { 50% { transform: scale(1.06, 0.97); } }
    .plank {
      position: absolute;
      z-index: 18;
      border: 2px solid #19204a;
      border-radius: 5px;
      background:
        radial-gradient(circle at 9% 50%, #4b5374 0 2.2px, transparent 2.6px),
        radial-gradient(circle at 91% 50%, #4b5374 0 2.2px, transparent 2.6px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 22px, rgba(90,52,20,0.25) 22px 24px),
        linear-gradient(#e3a564, #c47f3e);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      transform: rotate(var(--rot));
      pointer-events: none;
    }
    .shot {
      position: absolute;
      width: 12px; height: 12px;
      margin: -6px 0 0 -6px;
      border-radius: 50%;
      z-index: 26;
      pointer-events: none;
    }
    .drop {
      position: absolute;
      border-radius: 50%;
      background: var(--cyan);
      z-index: 31;
      pointer-events: none;
    }

    #bot {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
    }

    @media (prefers-reduced-motion: reduce) {
      .w, .portal, .star { animation: none !important; }
      .stars { transition: none; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="deco grid" aria-hidden="true"></div>
  <div class="deco grid lit" aria-hidden="true" id="lit"></div>
  <div class="deco stars" aria-hidden="true" id="stars"></div>
  <div class="corner tl" aria-hidden="true"></div><div class="corner tr" aria-hidden="true"></div>
  <div class="corner bl" aria-hidden="true"></div><div class="corner br" aria-hidden="true"></div>
  <div class="mark" aria-hidden="true">duesify<i>.</i></div>
  <h1 aria-label="Coming soon">
    <span class="line"><span class="w" style="--i:0" id="word">Coming</span></span>
    <span class="line"><span class="w" style="--i:1" id="soon">Soon</span></span>
  </h1>

  <canvas id="bot" role="img" aria-label="A cute robot playing on the page"></canvas>

  <footer class="foot">© 2026 Duesify</footer>

  <script>
    // sprinkle a few dozen stars at random spots, each twinkling at its own pace
    (() => {
      const box = document.getElementById('stars');
      const n = Math.round(Math.min(70, innerWidth * innerHeight / 18000));
      for (let i = 0; i < n; i++) {
        const s = document.createElement('span');
        s.className = Math.random() < 0.15 ? 'star big' : 'star';
        s.style.left = (Math.random() * 100).toFixed(2) + '%';
        s.style.top = (Math.random() * 100).toFixed(2) + '%';
        s.style.setProperty('--d', (2.5 + Math.random() * 4).toFixed(2) + 's');
        s.style.setProperty('--t', (-Math.random() * 6).toFixed(2) + 's');
        box.appendChild(s);
      }
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      // mouse: light up the grid under the cursor, and drift the stars a touch for depth
      const lit = document.getElementById('lit');
      if (matchMedia('(pointer: fine)').matches) {
        addEventListener('pointermove', e => {
          lit.style.setProperty('--mx', e.clientX + 'px');
          lit.style.setProperty('--my', e.clientY + 'px');
          lit.classList.add('on');
          const dx = e.clientX / innerWidth - 0.5, dy = e.clientY / innerHeight - 0.5;
          box.style.transform = `translate(${(-dx * 14).toFixed(1)}px, ${(-dy * 10).toFixed(1)}px)`;
        });
        document.addEventListener('pointerleave', () => lit.classList.remove('on'));
      }

      // every so often a shooting star streaks across the top half
      const shoot = () => {
        const el = document.createElement('span');
        el.className = 'shoot';
        const x = innerWidth * (0.15 + Math.random() * 0.7), y = innerHeight * (0.05 + Math.random() * 0.3);
        const ang = 20 + Math.random() * 20, dist = 260 + Math.random() * 200;
        const rad = ang * Math.PI / 180;
        el.style.left = x - 130 + 'px'; el.style.top = y + 'px';
        box.appendChild(el);
        el.animate([
          { transform: `rotate(${ang}deg) translateX(0) scaleX(0.3)`, opacity: 0 },
          { opacity: 1, offset: 0.2 },
          { transform: `rotate(${ang}deg) translateX(${dist}px) scaleX(1)`, opacity: 0 },
        ], { duration: 1100, easing: 'cubic-bezier(0.3, 0, 0.6, 1)' }).onfinish = () => el.remove();
        setTimeout(shoot, 7000 + Math.random() * 8000);
      };
      setTimeout(shoot, 4000);
    })();
  </script>
  <script src="robot-rig.js"></script>
  <script src="scene.js"></script>
</body>
</html>
