<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duesify</title>
  <meta name="description" content="Duesify is launching soon. Leave your email and we'll let you know when it's ready.">
  <meta property="og:title" content="Duesify">
  <meta property="og:description" content="Launching soon. Leave your email and we'll let you know when it's ready.">
  <meta property="og:url" content="https://www.duesify.com">
  <meta name="theme-color" content="#2a1fd1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #2a1fd1;
      --paper: #f2eee6;
      --soft: rgba(242, 238, 230, 0.68);
      --line: rgba(242, 238, 230, 0.32);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--ink);
      color: var(--paper);
      font-family: "Instrument Sans", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.5;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 28px clamp(16px, 4vw, 48px);
      -webkit-font-smoothing: antialiased;
    }
    .mono {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--soft);
    }
    header { padding-bottom: 18px; border-bottom: 1px solid var(--line); }

    main {
      display: grid;
      grid-template-columns: 1fr minmax(280px, 400px);
      align-items: end;
      gap: 48px;
      padding: 64px 0 40px;
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(5rem, 19vw, 17rem);
      line-height: 0.82;
      letter-spacing: -0.035em;
      margin-left: -0.04em;
      padding-bottom: 0.2em;
    }
    h1 em { font-style: italic; }

    .side p { color: var(--soft); max-width: 34ch; }
    .side p strong { color: var(--paper); font-weight: 500; }

    form { margin-top: 28px; }
    label { display: block; margin-bottom: 10px; color: var(--soft); }
    .field {
      display: flex;
      border-bottom: 1px solid var(--paper);
    }
    input[type="email"] {
      flex: 1;
      min-width: 0;
      background: none;
      border: 0;
      outline: 0;
      color: var(--paper);
      font: inherit;
      padding: 10px 0;
    }
    input::placeholder { color: var(--line); }
    button {
      background: none;
      border: 0;
      color: var(--paper);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      padding: 10px 0 10px 16px;
    }
    button:hover, button:focus-visible { text-decoration: underline; text-underline-offset: 4px; outline: 0; }
    .field:focus-within { border-bottom-width: 2px; margin-bottom: -1px; }
    .hidden { display: none; }

    footer { padding-top: 18px; border-top: 1px solid var(--line); }

    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; align-content: end; gap: 28px; padding-top: 48px; }
      h1 { font-size: 30vw; }
    }
  </style>
</head>
<body>
  <header class="mono">
    <span>Duesify</span>
    <span>Coming soon</span>
  </header>

  <main>
    <h1>dues<em>ify</em></h1>

    <div class="side">
      <p><strong>We're not quite ready yet.</strong> The site is still being built. Leave your email and we'll write once, when it's live.</p>

      <form name="notify" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thanks.html">
        <input type="hidden" name="form-name" value="notify">
        <p class="hidden"><label>Leave this empty <input name="bot-field"></label></p>
        <label class="mono" for="email">Get notified</label>
        <div class="field">
          <input id="email" type="email" name="email" placeholder="name@email.com" required>
          <button type="submit">Notify me &rarr;</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="mono">
    <span>&copy; <span id="year">2026</span> Duesify</span>
    <span>www.duesify.com</span>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
