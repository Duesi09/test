<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duesify — Coming soon</title>
  <meta name="description" content="Coming soon.">
  <meta property="og:title" content="Duesify">
  <meta property="og:description" content="Coming soon.">
  <meta property="og:url" content="https://www.duesify.com">
  <meta name="theme-color" content="#0b1631">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1631;
      --text: #eaf0ff;
      --cyan: #7de3f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-family: "Manrope", system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: min(16vw, 19vh);
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -0.035em;
      text-transform: uppercase;
      text-align: center;
      padding: 1.1em 16px 0.6em;    /* room above for the robot's jumps */
    }
    .line { display: block; white-space: nowrap; }
    .w {
      display: inline-block;
      animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      animation-delay: calc(var(--i) * 140ms);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(0.3em); } }

    /* Splash bits for the hidden pool, portals and portal-gun shots */
    .ripple {
      position: absolute;
      width: 70px; height: 14px;
      margin: -7px 0 0 -35px;
      border: 2px solid rgba(125, 227, 245, 0.75);
      border-radius: 50%;
      z-index: 31;
      pointer-events: none;
      animation: ripple 0.9s ease-out forwards;
    }
    @keyframes ripple { from { transform: scale(0.3); } to { transform: scale(2.2); opacity: 0; } }
    .portal {
      --c: 79, 216, 255;
      position: absolute;
      z-index: 15;
      border-radius: 50%;
      border: 4px solid rgb(var(--c));
      background: radial-gradient(ellipse at center, rgba(var(--c), 0.55), rgba(var(--c), 0.18) 55%, rgba(var(--c), 0) 72%);
      box-shadow: 0 0 18px rgba(var(--c), 0.8), inset 0 0 16px rgba(var(--c), 0.7);
      pointer-events: none;
      transform: scale(0);
      transition: transform 0.35s cubic-bezier(0.3, 1.5, 0.5, 1);
    }
    .portal.orange { --c: 255, 154, 60; }
    .portal.open { transform: scale(1); animation: wobble 1.2s ease-in-out infinite; }
    .portal.closing { transform: scale(0); transition-timing-function: ease-in; }
    @keyframes wobble { 50% { transform: scale(1.06, 0.97); } }
    .shot {
      position: absolute;
      width: 12px; height: 12px;
      margin: -6px 0 0 -6px;
      border-radius: 50%;
      z-index: 26;
      pointer-events: none;
    }
    .drop {
      position: absolute;
      border-radius: 50%;
      background: var(--cyan);
      z-index: 31;
      pointer-events: none;
    }

    #bot {
      position: absolute;
      top: 0; left: 0;
      z-index: 20;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.4s;
      -webkit-tap-highlight-color: transparent;
    }

    @media (prefers-reduced-motion: reduce) {
      .w, .portal { animation: none !important; }
    }
  </style>
</head>
<body>
  <h1 aria-label="Coming soon">
    <span class="line"><span class="w" style="--i:0" id="word">Coming</span></span>
    <span class="line"><span class="w" style="--i:1" id="soon">Soon</span></span>
  </h1>

  <canvas id="bot" role="img" aria-label="A cute robot playing on the page"></canvas>

  <script src="robot-rig.js"></script>
  <script src="scene.js"></script>
</body>
</html>
