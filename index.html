<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duesify — Portfolio</title>
  <meta name="description" content="Portfolio coming soon. Projects, work and more at duesify.com.">
  <meta property="og:title" content="Duesify — Portfolio">
  <meta property="og:description" content="Portfolio coming soon.">
  <meta property="og:url" content="https://www.duesify.com">
  <meta name="theme-color" content="#0c0c10">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c10;
      --surface: #15151c;
      --border: #26262f;
      --text: #f4f4f6;
      --muted: #8d8d99;
      --accent: #7c6cff;
      --accent-hover: #8f82ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: "Geist", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 24px; }

    header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
    }
    .logo-mark {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: var(--accent);
      display: grid; place-items: center;
      font-size: 15px; font-weight: 600; color: #fff;
    }
    .status {
      font-size: 13px;
      color: var(--muted);
      display: flex; align-items: center; gap: 8px;
    }
    .status::before {
      content: "";
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
    }

    main { flex: 1; display: flex; align-items: center; }
    .hero { max-width: 620px; padding: 64px 0 96px; }
    .eyebrow {
      font-size: 14px;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.035em;
    }
    .lead {
      margin-top: 20px;
      font-size: 18px;
      color: var(--muted);
      max-width: 48ch;
    }

    form {
      margin-top: 36px;
      display: flex;
      gap: 10px;
      max-width: 440px;
    }
    input[type="email"] {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      transition: border-color 0.15s;
    }
    input[type="email"]::placeholder { color: #5d5d68; }
    input[type="email"]:focus { outline: none; border-color: var(--accent); }
    button {
      height: 46px;
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent-hover); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .hint { margin-top: 12px; font-size: 13px; color: #5d5d68; }
    .hidden { display: none; }

    footer { border-top: 1px solid var(--border); }
    footer .wrap {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      height: 64px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      form { flex-direction: column; }
      input[type="email"] { flex: none; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo" href="/"><span class="logo-mark">d</span>duesify</a>
      <span class="status">Coming soon</span>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="hero">
        <p class="eyebrow">Portfolio</p>
        <h1>My work is almost ready to share.</h1>
        <p class="lead">I'm putting my projects together in one place. Leave your email and I'll let you know when the site is live.</p>

        <form name="notify" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thanks.html">
          <input type="hidden" name="form-name" value="notify">
          <p class="hidden"><label>Leave this empty <input name="bot-field"></label></p>
          <input type="email" name="email" placeholder="Your email" aria-label="Your email" required>
          <button type="submit">Notify me</button>
        </form>
        <p class="hint">One email when it launches. Nothing else.</p>
      </section>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span>&copy; <span id="year">2026</span> Duesify</span>
      <span>duesify.com</span>
    </div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
